<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INKSPIRE Hub - Global Intelligence (1M+ Pages)</title>
    <style>
        :root { --primary: #4f46e5; --bg-color: #f8fafc; --card-bg: #ffffff; --text-main: #1e293b; --text-muted: #475569; --border-color: #e2e8f0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; line-height: 1.6; }
        header { background-color: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 2rem 1rem; text-align: center; margin-bottom: 2rem; }
        header h1 { margin: 0; font-size: 2rem; color: var(--primary); }
        .container { width: 100%; max-width: 650px; margin: 0 auto; padding: 0 1rem; }
        .search-box { width: 100%; padding: 0.85rem 1rem; font-size: 0.95rem; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 2rem; outline: none; background: #fff; }
        .article { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; margin-bottom: 1.5rem; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); }
        .article img { width: 100%; height: 220px; object-fit: cover; display: block; }
        .article-content { padding: 1.5rem; }
        .article h2 { font-size: 1.15rem; color: #0f172a; margin-top: 0; }
        .definition-box { background: #f1f5f9; border-left: 4px solid var(--primary); padding: 0.75rem 1rem; margin: 0.8rem 0; font-size: 0.9rem; color: #334155; }
        .article p { color: var(--text-muted); font-size: 0.9rem; margin: 0; }
        .cat-tag { display: inline-block; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; background: #e0e7ff; color: var(--primary); padding: 3px 8px; border-radius: 4px; margin-bottom: 0.6rem; }
        
        /* 1 Million Pages Jump & Pagination Control */
        .pagination-box { background: #fff; border: 1px solid var(--border-color); border-radius: 10px; padding: 1.2rem; margin: 3rem 0; text-align: center; }
        .page-jump-row { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 1rem; flex-wrap: wrap; }
        .page-jump-row input { width: 100px; padding: 6px 10px; border: 1px solid var(--border-color); border-radius: 6px; text-align: center; font-weight: 600; }
        .btn { padding: 6px 14px; background: var(--primary); color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
        .btn:hover { opacity: 0.9; }
        .nav-links { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }

        footer { text-align: center; padding: 2.5rem 1rem; background-color: #1e293b; color: #94a3b8; font-size: 0.85rem; margin-top: 4rem; }
    </style>
</head>
<body>
    <header>
        <h1>INKSPIRE HUB</h1>
        <p>Global Intelligence Database (Scalable up to 1,000,000+ Pages)</p>
    </header>

    <div class="container">
        <input type="text" id="searchInput" class="search-box" placeholder="Search across all modules..." onkeyup="filterModules()">
        
        <!-- Dynamic Content Container -->
        <div id="moduleView"></div>

        <!-- 1M Scale Navigation & Jump Box -->
        <div class="pagination-box">
            <div class="nav-links">
                <button class="btn" id="prevBtn" onclick="changePage(-1)">&laquo; Previous Page</button>
                <span id="pageIndicator" style="font-weight: 700; color: var(--text-main);">Page 1 of 1,000,000</span>
                <button class="btn" id="nextBtn" onclick="changePage(1)">Next Page &raquo;</button>
            </div>
            <div class="page-jump-row">
                <label for="jumpInput" style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">Jump directly to page:</label>
                <input type="number" id="jumpInput" min="1" max="1000000" placeholder="1 - 1000000">
                <button class="btn" onclick="jumpToPage()">Go</button>
            </div>
        </div>
    </div>

    <footer><p>&copy; 2026 INKSPIRE. All Rights Reserved. (Massive Scale Edition)</p>
