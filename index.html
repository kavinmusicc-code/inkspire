        <p>&copy; 2026 InkSpire. All rights reserved.</p>
    </footer>

    <script>
        function showHome() {
            document.getElementById('posts-container').classList.remove('hidden');
            document.getElementById('editor-view').classList.add('hidden');
        }

        function showEditor() {
            document.getElementById('posts-container').classList.add('hidden');
            document.getElementById('editor-view').classList.remove('hidden');
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            const btn = document.getElementById('dark-mode-btn');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                btn.textContent = '🌙';
            } else {
                html.classList.add('dark');
                btn.textContent = '☀️';
            }
        }

        function publishArticle() {
            const title = document.getElementById('article-title').value;
            const category = document.getElementById('article-category').value;
            const imageUrl = document.getElementById('article-image').value;
            const videoUrl = document.getElementById('article-video').value;
            const body = document.getElementById('article-body').value;

            if(!title || !body) {
                alert('Please fill in both title and body!');
                return;
            }

            let mediaContent = '';
            if(imageUrl) {
                mediaContent += `<img src="${imageUrl}" alt="Post cover" class="w-full h-48 object-cover">`;
            }
            if(videoUrl) {
                let embedUrl = videoUrl;
                if(videoUrl.includes('watch?v=')) {
                    embedUrl = videoUrl.replace('watch?v=', 'embed/');
                } else if(videoUrl.includes('youtu.be/')) {
                    embedUrl = videoUrl.replace('youtu.be/', 'www.youtube.com/embed/');
                }
                mediaContent += `<div class="w-full"><iframe src="${embedUrl}" class="w-full h-64" frameborder="0" allowfullscreen></iframe></div>`;
            }

            const container = document.getElementById('posts-container');
            const newArticle = document.createElement('article');
            newArticle.className = "bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 overflow-hidden hover:shadow-md transition";
            newArticle.innerHTML = `
                ${mediaContent}
                <div class="p-6">
                    <span class="text-xs font-bold text-indigo-600 dark:text-indigo-400 uppercase tracking-wider">${category || 'General'}</span>
                    <h2 class="text-2xl font-bold text-slate-900 dark:text-white mt-1 mb-3">${title}</h2>
                    <p class="text-slate-600 dark:text-slate-300 mb-4 whitespace-pre-line">${body}</p>
                    <div class="flex items-center justify-between text-sm text-slate-400">
                        <span>Admin/Space</span>
                        <span>Just now</span>
                    </div>
                </div>
            `;

            container.prepend(newArticle);
            alert('Article published successfully!');
            
            document.getElementById('article-title').value = '';
            document.getElementById('article-category').value = '';
            document.getElementById('article-image').value = '';
            document.getElementById('article-video').value = '';
            document.getElementById('article-body').value = '';

            showHome();
        }
    </script>
