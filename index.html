<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Merriweather', Georgia, serif; }
    </style>
</head>
<body class="bg-[#121212] text-[#F3F4F6] min-h-screen flex flex-col antialiased">

    <!-- HEADER -->
    <header class="sticky top-0 z-40 bg-[#121212]/90 backdrop-blur-md border-b border-[#27272A]">
        <div class="max-w-2xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="#home" onclick="vibratePhone(20)" class="font-serif font-bold text-lg tracking-tight">Your Name</a>
            <nav class="hidden sm:flex items-center gap-6 text-sm text-[#9CA3AF]">
                <a href="#articles" onclick="vibratePhone(20)" class="hover:text-white transition">Posts</a>
                <a href="#about" onclick="vibratePhone(20)" class="hover:text-white transition">About</a>
            </nav>
            <button onclick="vibratePhone(35); toggleMobileMenu();" class="sm:hidden p-2 border border-[#27272A] rounded-lg text-sm">Menu</button>
        </div>
    </header>

    <!-- MOBILE MENU -->
    <div id="mobile-menu" class="fixed inset-0 z-50 bg-[#121212] p-6 flex flex-col space-y-6 transform translate-x-full transition-transform duration-300">
        <div class="flex justify-between items-center border-b border-[#27272A] pb-4">
            <span class="font-serif font-bold text-xl">Menu</span>
            <button onclick="vibratePhone(20); toggleMobileMenu();" class="text-xl">✕</button>
        </div>
        <a href="#articles" onclick="vibratePhone(25); toggleMobileMenu();" class="text-lg py-2 border-b border-[#27272A]/50">Posts</a>
        <a href="#about" onclick="vibratePhone(25); toggleMobileMenu();" class="text-lg py-2 border-b border-[#27272A]/50">About</a>
    </div>

    <!-- MAIN CONTENT -->
    <main class="flex-grow max-w-2xl mx-auto px-6 py-12 space-y-16 w-full">
        
        <!-- HERO -->
        <section id="home" class="space-y-6 pt-4">
            <div class="space-y-3">
                <span class="text-xs font-mono uppercase tracking-widest text-blue-400 bg-blue-600/10 px-3 py-1 rounded-full border border-blue-600/20 inline-block">Welcome Hub</span>
                <h1 class="text-3xl sm:text-4xl font-serif font-bold leading-tight">Your Title Here.</h1>
                <p class="text-[#9CA3AF] text-base leading-relaxed font-light">
                    Add your short intro or description here.
                </p>
            </div>
        </section>

        <!-- ARTICLES SECTION -->
        <section id="articles" class="border-t border-[#27272A] pt-12 space-y-10">
            <div class="space-y-1">
                <h2 class="text-xs font-mono uppercase tracking-widest text-[#9CA3AF]">Feed</h2>
                <h3 class="text-2xl font-serif font-bold">Latest Posts & Videos</h3>
            </div>

            <!-- Dynamic Articles Feed -->
            <div id="articles-container" class="space-y-12">
                <!-- JavaScript loads articles here -->
            </div>
        </section>

        <!-- ABOUT SECTION -->
        <section id="about" class="border-t border-[#27272A] pt-12 space-y-4">
            <h2 class="text-xs font-mono uppercase tracking-widest text-[#9CA3AF]">Author</h2>
            <h3 class="text-2xl font-serif font-bold">About Me</h3>
            <p class="text-[#9CA3AF] text-sm leading-relaxed font-light">
                Write something about yourself here.
            </p>
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="border-t border-[#27272A] py-8 text-center text-xs text-[#9CA3AF]">
        <p>&copy; 2026 Your Name. All rights reserved.</p>
    </footer>

    <!-- SCRIPT -->
    <script>
        // =========================================================================
        // ✍️ ADMIN POSTS CONTROL (Yahan apni nayi post, photo ya YouTube link add karein)
        // =========================================================================
        const articlesList = [
            // Agar koi post nahi chahiye toh is array ko khali [] chhor sakte hain.
            {
                title: "Aapki Pehli Post Ka Title Yahan Hoga",
                date: "September 22, 2026",
                category: "General",
                image: "", // Photo ka link yahan daal sakte hain, ya khali "" chhor dein
                content: "Yahan aap apni post ka main text ya description likhenge.",
                youtubeLink: "" // YouTube video ka link yahan daal sakte hain
            }
        ];

        function renderArticles() {
            const container = document.getElementById('articles-container');
            container.innerHTML = '';

            if(articlesList.length === 0) {
                container.innerHTML = '<p class="text-sm text-[#9CA3AF]">No posts available yet.</p>';
                return;
            }

            articlesList.forEach(item => {
                let html = `
                    <article class="space-y-4 border-b border-[#27272A] pb-10">
                        <div class="flex items-center gap-3 text-xs text-[#9CA3AF] font-mono">
                            <span class="text-blue-400 font-semibold">${item.category}</span>
                            <span>•</span>
                            <span>${item.date}</span>
                        </div>
                        
                        <h3 class="text-2xl font-serif font-bold leading-snug">${item.title}</h3>
                        
                        ${item.image && item.image.trim() !== "" ? `
                            <div class="w-full h-56 overflow-hidden rounded-xl border border-[#27272A] my-4">
                                <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover">
                            </div>
                        ` : ''}

                        <p class="text-[#9CA3AF] text-sm leading-relaxed font-light">
                            ${item.content}
                        </p>

                        ${item.youtubeLink && item.youtubeLink.trim() !== "" ? `
                            <div class="pt-2">
                                <a href="${item.youtubeLink}" target="_blank" onclick="vibratePhone(30)" class="inline-flex items-center gap-2 text-xs font-mono font-semibold text-red-400 bg-red-600/10 px-4 py-2 rounded-lg border border-red-600/20 transition">
                                    <span>▶ Watch Video on YouTube</span>
                                    <span>→</span>
                                </a>
                            </div>
                        ` : ''}
                    </article>
                `;
                container.innerHTML += html;
            });
        }

        window.onload = renderArticles;

        function vibratePhone(ms) {
            if ("vibrate" in navigator) {
                navigator.vibrate(ms);
            }
        }

        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('translate-x-full');
        }
    </script>
</body>
</html>
